name: UNO checks
on:
  push:
  pull_request:
jobs:
  verify:
    # Pinned: on ubuntu-26.04 (ubuntu-latest since 2026-11) the Validator test
    # "fails validation when a non-code fiscal region is removed" stops
    # rejecting; it passes on 24.04 and macOS. Production runs its own image
    # (Dockerfile.worker). Move only after that test is green on the new image.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
